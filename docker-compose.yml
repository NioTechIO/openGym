name: opengym

services:
  api:
    build:
      context: ./api
      target: default
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
      RP_ID: ${RP_ID:?}
      ORIGIN: ${ORIGIN:?}
      RP_NAME: ${RP_NAME:-openGym}
      DEFAULT_LANG: ${DEFAULT_LANG:-pt-BR}
      FIRST_USER_ADMIN: ${FIRST_USER_ADMIN:-1}
      ADMIN_UIDS: ${ADMIN_UIDS:-}
      INVITE_ONLY: ${INVITE_ONLY:-0}
      ALLOW_GUEST: ${ALLOW_GUEST:-0}
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-0}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SESSION_DAYS: ${SESSION_DAYS:-90}
      AUDIT_LOG: ${AUDIT_LOG:-1}
      AUDIT_MAX: ${AUDIT_MAX:-5000}
      AUDIT_DAYS: ${AUDIT_DAYS:-90}
      AUDIT_IP: ${AUDIT_IP:-off}
      MEDIA_UPLOADS: ${MEDIA_UPLOADS:-1}
      MEDIA_QUOTA_MB: ${MEDIA_QUOTA_MB:-200}
      MEDIA_VIDEO_MAX_MB: ${MEDIA_VIDEO_MAX_MB:-90}
      MEDIA_MIN_FREE_MB: ${MEDIA_MIN_FREE_MB:-512}
    volumes:
      - opengym-data:/data

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NGINX_PORT: "80"
      BACKEND: api
      PORT: "3000"
      RESOLVER: 127.0.0.11
      CF_CONNECTING_IP: $$http_cf_connecting_ip
      MEDIA_UPLOAD_MAX: ${MEDIA_UPLOAD_MAX:-96m}
    expose:
      - "80"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider -q http://127.0.0.1:80/api/health || exit 1
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  opengym-data:
